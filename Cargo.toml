[package]
name = "lernzeit"
version = "0.1.3"
edition = "2021"
description = "Study timer that follows Spotify, with stats."
license = "MIT"
repository = "https://github.com/Nikityyy/lernzeit"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow"] }
epaint_default_fonts = { version = "0.37", default-features = false }
miniz_oxide = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.26"

[dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1.34"

[profile.release]
# Measured: "s" gives a smaller exe than "z" and "3" for this app.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
